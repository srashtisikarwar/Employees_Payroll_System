<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background: linear-gradient(135deg, #0d6efd, #023e8a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .login-card{
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .login-title{
            text-align: center;
            margin-bottom: 25px;
            color: #0d6efd;
            font-weight: bold;
        }

        .form-control{
            height: 45px;
            border-radius: 10px;
        }

        .btn-login{
            width: 100%;
            height: 45px;
            border-radius: 10px;
            background: #0d6efd;
            border: none;
            font-weight: bold;
        }

        .btn-login:hover{
            background: #023e8a;
        }

    </style>

</head>
<body>

    <div class="login-card">

        
        <h2 class="login-title">
            Employee Payroll System
        </h2>
<p>Login to continue</p>
{% if form.errors %}
<div class="alert alert-danger">
    Invalid username or password.
</div>
{% endif %}

        <form method="post">

            {% csrf_token %}
            

            <div class="mb-3">
                <label>Username</label>
                <input type="text"
                       name="username"
                       class="form-control"
                       placeholder="Enter username"
                       required>
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input type="password"
                       name="password"
                       class="form-control"
                       placeholder="Enter password"
                       required>
            </div>

            <a href="{% url 'password_reset' %}">
    Forgot Password?
</a>

            <button type="submit" class="btn btn-primary btn-login">
                Login
            </button>

        </form>

    </div>

</body>
</html>
