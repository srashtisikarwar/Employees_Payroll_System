<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0d6efd, #023e8a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        .done-card {
            width: 450px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            text-align: center;
        }
        .done-title {
            color: #0d6efd;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .btn-back {
            width: 100%;
            height: 45px;
            border-radius: 10px;
            background: #0d6efd;
            border: none;
            font-weight: bold;
            color: white;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="done-card">
        <h2 class="done-title">Check Your Email</h2>
        <p class="text-muted mb-4">We've emailed you instructions for setting your password, if an account exists with the email you entered. You should receive them shortly.</p>
        <p class="text-muted mb-4">If you don't receive an email, please make sure you've entered the address you registered with, and check your spam folder.</p>
        <a href="{% url 'login' %}" class="btn-back">Back to Login</a>
    </div>
</body>
</html>
