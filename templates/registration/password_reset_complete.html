<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0d6efd, #023e8a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        .complete-card {
            width: 450px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            text-align: center;
        }
        .complete-title {
            color: #198754;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .btn-login {
            width: 100%;
            height: 45px;
            border-radius: 10px;
            background: #0d6efd;
            border: none;
            font-weight: bold;
            color: white;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="complete-card">
        <div class="mb-4">
            <i class="fas fa-check-circle fa-4x text-success"></i>
        </div>
        <h2 class="complete-title">Password Reset!</h2>
        <p class="text-muted mb-4">Your password has been set. You may go ahead and log in now.</p>
        <a href="{% url 'login' %}" class="btn-login">Log In</a>
    </div>
</body>
</html>
