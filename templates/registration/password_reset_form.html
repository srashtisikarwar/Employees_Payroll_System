<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0d6efd, #023e8a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        .reset-card {
            width: 450px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .reset-title {
            text-align: center;
            margin-bottom: 20px;
            color: #0d6efd;
            font-weight: bold;
        }
        .form-control {
            height: 45px;
            border-radius: 10px;
        }
        .btn-reset {
            width: 100%;
            height: 45px;
            border-radius: 10px;
            background: #0d6efd;
            border: none;
            font-weight: bold;
            color: white;
        }
        .btn-reset:hover {
            background: #023e8a;
        }
    </style>
</head>
<body>
    <div class="reset-card">
        <h2 class="reset-title">Forgot Password?</h2>
        <p class="text-muted text-center mb-4">Enter your email address below, and we'll email instructions for setting a new one.</p>
        <form method="post">
    {% csrf_token %}

    {% if form.errors %}
    <div class="alert alert-danger">
        {{ form.errors }}
    </div>
    {% endif %}

    <div class="mb-3">
        {{ form.email.label_tag }}
        {{ form.email }}
    </div>

    <button type="submit" class="btn btn-reset">
        Send Reset Link
    </button>
</form>
    </div>
</body>
</html>
